name: Static catalog and quality checks

on:
  pull_request:
    branches: [master]
    paths:
      - 'public/arf.json'
      - 'public/index.html'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'wrangler.jsonc'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON syntax
        run: python3 -m json.tool public/arf.json > /dev/null
      - name: Offline unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Check generic-input API profiles without network access
        run: python3 tools/functional_probe.py --dry-run
      - name: Validate reproducible Cloudflare Worker generation
        run: |
          python3 tools/build_edge_worker.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dist/worker.mjs').read_text(encoding='utf8')
          assert "raw.githubusercontent.com/zakkyd1917/OSINT-Framework/master/public/index.html" in p
          assert "script-src 'none'" in p
          assert "EMBEDDED_HTML" in p
          print('Edge fallback and no-client-JavaScript policy configured')
          PY
      - name: Generate JavaScript-free catalog
        run: |
          python3 tools/build_static_catalog.py
          python3 - <<'PY'
          import pathlib
          text = pathlib.Path('public/index.html').read_text(encoding='utf-8').lower()
          assert '<script' not in text
          assert 'href="javascript:' not in text
          print('No executable JavaScript in static catalog')
          PY
