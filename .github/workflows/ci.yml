name: Static catalog and quality checks

on:
  push:
    branches: [master, 'development/**']
    paths-ignore:
      - 'evidence/latest.json'
      - 'evidence/exceptions.json'
      - 'evidence/state.json'
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON syntax
        run: python3 -m json.tool public/arf.json > /dev/null
      - name: Offline unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Generate JavaScript-free catalog
        run: |
          python3 tools/build_static_catalog.py
          python3 - <<'PY'
          import pathlib
          text = pathlib.Path('public/index.html').read_text(encoding='utf-8').lower()
          assert '<script' not in text
          assert 'href="javascript:' not in text
          print('No executable JavaScript in static catalog')
          PY
