name: Evidence-backed resource observations

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: Number of unique HTTPS source endpoints to observe
        required: false
        default: '90'
  schedule:
    - cron: '17 6,18 * * *'

permissions:
  contents: write
  issues: write

concurrency:
  group: source-observations
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Unit tests without external probes
        run: python3 -m unittest discover -s tests -v
      - name: Observe rotating sample, no JavaScript
        env:
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '90' }}
        run: python3 tools/verify_sources.py --batch-size "$BATCH_SIZE"
      - name: Check one allowlisted benign functional API query
        run: python3 tools/functional_probe.py
      - name: Alert only on repeated missing responses
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 tools/alert_exceptions.py
      - name: Summarize nonfatal exceptions for review
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from collections import Counter
          items=json.load(open("evidence/exceptions.json"))["items"]
          print("## Passive source-check exceptions")
          print("Nonfatal anomalies; not evidence that a service has closed.\n")
          for kind,count in sorted(Counter(x["exception"] for x in items).items()):
              print(f"- {kind}: {count}")
          PY
      - name: Rebuild static directory
        run: python3 tools/build_static_catalog.py
      - name: Preserve observation artifacts before attempting to push
        uses: actions/upload-artifact@v4
        with:
          name: source-observations-${{ github.run_id }}
          path: |
            evidence/latest.json
            evidence/exceptions.json
            evidence/functional_latest.json
            evidence/state.json
          if-no-files-found: error
          retention-days: 30
      - name: Commit evidence with bounded conflict-safe retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "osint-evidence-bot"
          git config user.email "osint-evidence-bot@users.noreply.github.com"
          git add evidence/state.json evidence/latest.json evidence/exceptions.json evidence/functional_latest.json public/index.html
          if git diff --cached --quiet; then
            echo "No evidence changes to publish."
            exit 0
          fi
          git commit -m "Evidence: bounded HTTPS observations [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin master
            if ! git rebase origin/master; then
              git rebase --abort || true
              echo "::error::Evidence commit conflicted with newer catalog changes. Observation artifact is preserved; manual reconciliation required."
              exit 1
            fi
            if git push origin HEAD:master; then
              echo "Evidence published in attempt $attempt"
              exit 0
            fi
            echo "Concurrent update detected; retrying without force ($attempt/3)"
            sleep $((attempt * 4))
          done
          echo "::error::Evidence was not pushed after three safe attempts; artifacts are available."
          exit 1
